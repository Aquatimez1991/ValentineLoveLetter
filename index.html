<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Carta romántica interactiva" />
  <meta name="theme-color" content="#e7d9f0" />
  <title>Sobre con Carta</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <!-- Preload de imágenes críticas -->
  <link rel="preload" href="assets/Corazon-Cinnamoroll.gif" as="image">
  <link rel="preload" href="assets/Cupid-Cinnamoroll.png" as="image">
</head>
<body>
  <!-- Intro GIF -->
  <div id="intro-gif" class="intro-gif-container">
    <img src="assets/Corazon-Cinnamoroll.gif" alt="Corazon Cinnamoroll" class="intro-gif" loading="eager">
  </div>

  <!-- Overlay para el fondo -->
  <div class="overlay" id="overlay"></div>

  <!-- Cupids decorativos -->
  <img src="assets/Cupid-Cinnamoroll.png" alt="Cupid Cinnamoroll" class="cupid cupid-left" id="cupidLeft" loading="lazy">
  <img src="assets/Cupid-Cinnamoroll.png" alt="Cupid Cinnamoroll" class="cupid cupid-right" id="cupidRight" loading="lazy">
  <img src="assets/Cupid-Cinnamoroll.png" alt="Cupid Cinnamoroll" class="cupid cupid-top-left" id="cupidTopLeft" loading="lazy">
  <img src="assets/Cupid-Cinnamoroll.png" alt="Cupid Cinnamoroll" class="cupid cupid-top-right" id="cupidTopRight" loading="lazy">

  <!-- Contenedor principal -->
  <div class="container" id="main-container" style="display:none;">
    <div class="envelope" id="envelope">
      <div class="side-left"></div>
      <div class="side-right"></div>
      <div class="bottom"></div>
      <div class="letter" id="letter">
        <div class="letter-content">
          <p class="to"><strong>Para: Ross Miau</strong></p>
          <p>Hola, sé que no nos conocemos, pero quería decirte que me pareces una persona muy bonita. Si en algún momento te gustaría conversar o compartir una tarde tranquila, me encantaría conocerte mejor.</p>
          <p>¿Te gustaría salir conmigo algún día? Me haría muy feliz.</p>
          <p class="signature" style="margin-top: 20px; font-style: italic;">Con cariño, Elias ❤️</p>
        </div>
        <button class="close-btn" onclick="collapseLetter()">&times;</button>
      </div>
      <div class="flap" id="flap">
        <svg width="400" height="120" viewBox="0 0 400 120" style="position:absolute;top:0;left:0;">
          <polygon points="0,0 400,0 200,120" fill="#d84341" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Controles -->
  <div class="controls" id="main-controls" style="display:none;">
    <button onclick="openLetter()" type="button">ABRIR</button>
    <button onclick="closeLetter()" type="button">CERRAR</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
